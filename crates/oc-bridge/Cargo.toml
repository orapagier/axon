[package]
name = "oc-bridge"
version = "0.1.0"
edition = "2021"
description = "OpenCode to OpenAI-compatible bridge for Axon's free-model pool"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"