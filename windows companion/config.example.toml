# Win Automation API - Config File
# Copy this to config.toml and fill in your values.
#
# When installed as a service, config.toml lives next to windowsapi.exe in
#   C:\ProgramData\WindowsAPI\
# That directory is restricted to SYSTEM and Administrators, so editing it needs
# an elevated editor. Restart the service after any change:
#   windowsapi --stop  &&  windowsapi --start
#
# NEVER commit config.toml, and never put real credentials in THIS file —
# config.example.toml is committed to git and is bundled into the installer
# as the default config for fresh installs.

# Your Cloudflare Tunnel token from the dashboard
# Get it from: Cloudflare Zero Trust > Networks > Tunnels > your tunnel > Configure
tunnel_token = "YOUR_CLOUDFLARE_TUNNEL_TOKEN_HERE"

# Secret used to authenticate every API request (Authorization: Bearer <secret>).
# Must be at least 32 characters of high-entropy random text.
# Generate one with:  openssl rand -hex 32
api_secret = "change-this-to-a-strong-random-secret"

# Local port the API listens on (cloudflared forwards to this)
port = 8080

# Loopback port for the desktop agent — the helper the service launches into
# your logged-in session to handle screenshot, clipboard, keyboard, mouse and
# window routes. Bound to 127.0.0.1 only and never exposed through the tunnel.
# Defaults to port + 1. Only set this if something else already holds that port.
# session_port = 8081

# Public URL for downloadable file links (your Cloudflare tunnel domain)
# Screenshots and other binary responses are saved as files and served via this URL
public_url = "https://windows.example.com"

# Transport cloudflared uses to reach the Cloudflare edge.
#
#   "auto"   (default) start on QUIC, fall back to HTTP/2 if QUIC keeps dropping
#   "http2"  pin HTTP/2 over TCP
#   "quic"   pin QUIC over UDP/7844
#
# QUIC is faster, but it rides UDP/7844, and plenty of consumer routers, ISPs
# and captive networks quietly drop long-lived UDP flows. When that happens the
# tunnel does not die — it reconnects, over and over, and the host answers 502
# in the gaps while the service still looks perfectly healthy locally. If this
# machine is on Wi-Fi behind consumer NAT and the tunnel keeps flapping, pin
# "http2" and it will stop.
# tunnel_protocol = "auto"

# Address family used to reach the Cloudflare edge.
#
#   "auto"  (default) use whichever of IPv4/IPv6 is actually working
#   "4"     IPv4 only — this is cloudflared's own default
#   "6"     IPv6 only
#
# We default to "auto" rather than cloudflared's "4" because a machine whose
# IPv4 path to the edge is being dropped will often reach it perfectly well over
# IPv6, and the IPv4-only default turns that into a dead tunnel for no reason.
# On an IPv4-only network "auto" behaves exactly like "4".
# tunnel_edge_ip_version = "auto"

# Loopback port for cloudflared's metrics endpoint. The supervisor polls it to
# tell "the tunnel is up" apart from "the process is up" — without it, a
# cloudflared with zero edge connections looks identical to a working one.
# Bound to 127.0.0.1 only and never exposed through the tunnel.
# tunnel_metrics_port = 20241
