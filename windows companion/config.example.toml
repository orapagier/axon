# Win Automation API - Config File
# Copy this to config.toml and fill in your values.
# Place config.toml next to windowsapi.exe
#
# NEVER commit config.toml, and never put real credentials in THIS file —
# config.example.toml is committed to git and is bundled into the installer
# as the default config for fresh installs.

# Your Cloudflare Tunnel token from the dashboard
# Get it from: Cloudflare Zero Trust > Networks > Tunnels > your tunnel > Configure
tunnel_token = "YOUR_CLOUDFLARE_TUNNEL_TOKEN_HERE"

# Secret used to authenticate every API request (Authorization: Bearer <secret>).
# Must be at least 32 characters of high-entropy random text.
# Generate one with:  openssl rand -hex 32
api_secret = "change-this-to-a-strong-random-secret"

# Local port the API listens on (cloudflared forwards to this)
port = 8080

# Public URL for downloadable file links (your Cloudflare tunnel domain)
# Screenshots and other binary responses are saved as files and served via this URL
public_url = "https://windows.example.com"
