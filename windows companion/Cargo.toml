# Standalone crate — not a member of the Axon workspace at the repo root.
[workspace]

[package]
name = "windowsapi"
version = "1.0.0"
edition = "2021"
description = "Windows API"

[[bin]]
name = "windowsapi"
path = "src/main.rs"

[dependencies]
# Web server
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "fs"] }
tower = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Automation - keyboard & mouse
enigo = "0.2"

# Screenshots
screenshots = "0.8"
image = "0.25"
base64 = "0.22"

# System info & process management
sysinfo = "0.31"

# Open files, URLs, apps
open = "5"

# Clipboard
clipboard-win = "5"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
axum-extra = { version = "0.9", features = ["typed-header"] }
# The /agent proxy only ever talks to 127.0.0.1, so the default TLS stack and
# platform certificate verifier are dead weight — disable default features.
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
windows-service = "0.8.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_Graphics_Gdi",
    # Launching the session agent into the interactive desktop: WTSQueryUserToken
    # (RemoteDesktop), DuplicateTokenEx/TOKEN_* (Security), and
    # CreateEnvironmentBlock (Environment) are all required by session.rs.
    "Win32_Security",
    "Win32_System_RemoteDesktop",
    "Win32_System_Environment",
    "Win32_System_StationsAndDesktops",
    # The session token is handed to the agent over an inherited anonymous pipe
    # rather than argv, so it never appears in the process list.
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    # BCryptGenRandom for the loopback token — see server::loopback_token.
    "Win32_Security_Cryptography",
    # AttachConsole, so the GUI-subsystem binary can still talk to a terminal
    # when run as `windowsapi --install`.
    "Win32_System_Console",
]}

windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Shutdown",
    "Win32_System_JobObjects",
    "Win32_Security",
    # session.rs launches the desktop agent into the interactive session:
    # WTSQueryUserToken (RemoteDesktop) + CreateEnvironmentBlock (Environment).
    # DuplicateTokenEx / GetTokenInformation come from Win32_Security above.
    "Win32_System_RemoteDesktop",
    "Win32_System_Environment",
    "Win32_System_StationsAndDesktops",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
